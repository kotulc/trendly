<section id="trendly-top-rail-board" aria-label="Trendly Top rail refinements">
  <style>
    #trendly-top-rail-board .samples { display: flex; align-items: center; justify-content: center; gap: 8px; }
    #trendly-top-rail-board .sample { display: grid; place-items: center; width: 34px; height: 34px; background: Canvas; color: CanvasText; }
    #trendly-top-rail-board .sample-light { color-scheme: light; }
    #trendly-top-rail-board .sample-dark { color-scheme: dark; }
    #trendly-top-rail-board .mark { display: block; position: relative; }
    #trendly-top-rail-board .bar { position: absolute; background: currentColor; }
    #trendly-top-rail-board .frame { position: absolute; box-sizing: border-box; border-style: solid; border-color: currentColor; }
    #trendly-top-rail-board .label { font-weight: 500; }
  </style>
  <table class="table">
    <caption class="sr-only">Top rail logo variations in light and dark, at favicon and navbar sizes</caption>
    <thead>
      <tr>
        <th scope="col">Mark</th>
        <th class="text-center" scope="col">Favicon <span class="text-small text-muted">16 px</span></th>
        <th class="text-center" scope="col">Navbar <span class="text-small text-muted">24 px</span></th>
      </tr>
    </thead>
    <tbody>
      <tr data-mark="original">
        <th scope="row" class="label">Top rail<br><span class="text-small text-muted">Original</span></th>
      </tr>
      <tr data-mark="compact">
        <th scope="row" class="label">Compact rail<br><span class="text-small text-muted">Tighter frame, even steps</span></th>
      </tr>
      <tr data-mark="thin">
        <th scope="row" class="label">Thin rail<br><span class="text-small text-muted">Even frame weight</span></th>
      </tr>
      <tr data-mark="rounded">
        <th scope="row" class="label">Soft corners<br><span class="text-small text-muted">Compact rail with a small radius</span></th>
      </tr>
      <tr data-mark="wide">
        <th scope="row" class="label">Low profile<br><span class="text-small text-muted">Shorter, wider frame</span></th>
      </tr>
    </tbody>
  </table>
</section>
<script>
  (() => {
    const board = document.getElementById('trendly-top-rail-board');
    // Positions and sizes use a 32-unit grid. Each frame also specifies its top and side weights.
    const compact = {
      frame: [2, 2, 28, 28, 4, 2, 0],
      bars: [[6, 20, 4, 6], [14, 14, 4, 12], [22, 4, 4, 22]],
    };
    const marks = {
      original: {
        frame: [0, 0, 32, 32, 4, 2, 0],
        bars: [[6, 20, 4, 6], [12, 14, 4, 12], [20, 2, 4, 24]],
      },
      compact,
      thin: { ...compact, frame: [2, 2, 28, 28, 2, 2, 0],
        bars: [[6, 20, 4, 6], [14, 14, 4, 12], [22, 3, 4, 23]],
      },
      rounded: { ...compact, frame: [2, 2, 28, 28, 4, 2, 5] },
      wide: {
        frame: [0, 4, 32, 24, 4, 2, 0],
        bars: [[6, 18, 4, 6], [14, 12, 4, 12], [22, 6, 4, 18]],
      },
    };

    function rectangle(className, [x, y, width, height]) {
      const shape = document.createElement('span');
      shape.className = className;
      shape.style.left = `${x / 32 * 100}%`;
      shape.style.top = `${y / 32 * 100}%`;
      shape.style.width = `${width / 32 * 100}%`;
      shape.style.height = `${height / 32 * 100}%`;
      return shape;
    }

    for (const row of board.querySelectorAll('[data-mark]')) {
      const { frame, bars } = marks[row.dataset.mark];
      const [, , , , top, side, radius] = frame;
      for (const size of [16, 24]) {
        const cell = row.insertCell();
        const samples = document.createElement('div');
        samples.className = 'samples';
        samples.setAttribute('aria-hidden', 'true');
        cell.append(samples);
        for (const theme of ['light', 'dark']) {
          const sample = document.createElement('span');
          sample.className = `sample sample-${theme}`;
          const mark = document.createElement('span');
          mark.className = 'mark';
          mark.style.width = mark.style.height = `${size}px`;
          const outline = rectangle('frame', frame);
          outline.style.borderWidth = `${top * size / 32}px ${side * size / 32}px`;
          outline.style.borderBottomWidth = `${side * size / 32}px`;
          outline.style.borderRadius = `${radius * size / 32}px`;
          mark.append(outline, ...bars.map(bar => rectangle('bar', bar)));
          sample.append(mark);
          samples.append(sample);
        }
      }
    }
  })();
</script>
