<section id="trendly-t-mark-board" aria-label="Trendly logo variations">
  <style>
    #trendly-t-mark-board .samples { display: flex; align-items: center; justify-content: center; gap: 12px; }
    #trendly-t-mark-board .sample { display: grid; place-items: center; width: 32px; height: 32px; background: Canvas; color: CanvasText; }
    #trendly-t-mark-board .sample-light { color-scheme: light; }
    #trendly-t-mark-board .sample-dark { color-scheme: dark; }
    #trendly-t-mark-board .mark { display: block; position: relative; }
    #trendly-t-mark-board .mark > span { position: absolute; background: currentColor; }
    #trendly-t-mark-board .label { font-weight: 500; }
  </style>
  <table class="table">
    <caption class="sr-only">Five Trendly marks in light and dark, at favicon and navbar sizes</caption>
    <thead>
      <tr>
        <th scope="col">Mark</th>
        <th class="text-center" scope="col">Favicon <span class="text-small text-muted">16 px</span></th>
        <th class="text-center" scope="col">Navbar <span class="text-small text-muted">24 px</span></th>
      </tr>
    </thead>
    <tbody>
      <tr data-mark="crossbar">
        <th scope="row" class="label">Crossbar<br><span class="text-small text-muted">Unframed</span></th>
      </tr>
      <tr data-mark="floating">
        <th scope="row" class="label">Floating cap<br><span class="text-small text-muted">Unframed</span></th>
      </tr>
      <tr data-mark="inset">
        <th scope="row" class="label">Inset T<br><span class="text-small text-muted">Separate frame</span></th>
      </tr>
      <tr data-mark="rail">
        <th scope="row" class="label">Top rail<br><span class="text-small text-muted">T joins the top edge</span></th>
      </tr>
      <tr data-mark="corner">
        <th scope="row" class="label">Open corner<br><span class="text-small text-muted">T forms the upper right</span></th>
      </tr>
    </tbody>
  </table>
</section>
<script>
  (() => {
    const board = document.getElementById('trendly-t-mark-board');
    // Rectangles use a 32-unit grid: x, y, width, height.
    const marks = {
      crossbar: [[4, 22, 4, 6], [12, 16, 4, 12], [20, 8, 4, 20], [16, 4, 12, 4]],
      floating: [[4, 22, 4, 6], [12, 16, 4, 12], [20, 10, 4, 18], [16, 4, 12, 4]],
      inset: [[6, 20, 4, 6], [12, 16, 4, 10], [20, 10, 4, 16], [16, 6, 12, 4],
        [0, 0, 32, 2], [0, 2, 2, 28], [30, 2, 2, 28], [0, 30, 32, 2]],
      rail: [[6, 20, 4, 6], [12, 14, 4, 12], [20, 4, 4, 22],
        [0, 0, 32, 4], [0, 4, 2, 26], [30, 4, 2, 26], [0, 30, 32, 2]],
      corner: [[4, 22, 4, 6], [12, 16, 4, 12], [20, 6, 4, 22], [14, 2, 16, 4],
        [28, 6, 2, 24], [2, 30, 28, 2]],
    };

    for (const row of board.querySelectorAll('[data-mark]')) {
      for (const size of [16, 24]) {
        const cell = row.insertCell();
        const samples = document.createElement('div');
        samples.className = 'samples';
        samples.setAttribute('aria-hidden', 'true');
        cell.append(samples);
        for (const theme of ['light', 'dark']) {
          const sample = document.createElement('span');
          sample.className = `sample sample-${theme}`;
          const mark = document.createElement('span');
          mark.className = 'mark';
          mark.style.width = mark.style.height = `${size}px`;
          for (const [x, y, width, height] of marks[row.dataset.mark]) {
            const rect = document.createElement('span');
            rect.style.left = `${x / 32 * 100}%`;
            rect.style.top = `${y / 32 * 100}%`;
            rect.style.width = `${width / 32 * 100}%`;
            rect.style.height = `${height / 32 * 100}%`;
            mark.append(rect);
          }
          sample.append(mark);
          samples.append(sample);
        }
      }
    }
  })();
</script>
